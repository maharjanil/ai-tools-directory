<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Directory</title>

    <!-- ============ PWA META TAGS ============ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- iOS specific PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Tools">

    <!-- ============ BOOTSTRAP & ICONS ============ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- ============ CUSTOM STYLES ============ -->
    <style>
        .tool-card img {
            height: 200px;
            object-fit: cover;
            background-color: var(--bs-body-bg);
        }
        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .filter-btn.active {
            font-weight: bold;
        }
        /* Install button animation */
        .install-btn {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(13, 110, 253, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(13, 110, 253, 0); }
            100% { box-shadow: 0 0 0 0 rgba(13, 110, 253, 0); }
        }
    </style>
</head>
<body>

    <!-- ============ NAVBAR ============ -->
    <nav class="navbar navbar-expand-lg border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-robot"></i> AI Tools Directory
            </a>
            <div class="d-flex gap-2">
                <!-- Install App Button (Hidden by default, shown via JS when PWA is installable) -->
                <button class="btn btn-primary btn-sm install-btn d-none" id="install-btn">
                    <i class="bi bi-download"></i> Install App
                </button>
                <!-- Dark Mode Toggle -->
                <button class="btn btn-outline-secondary btn-sm" id="theme-toggle">
                    <i class="bi bi-moon-stars-fill" id="theme-icon"></i> 
                    <span id="theme-text">Dark Mode</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <div class="container pb-5">
        
        <!-- Controls: Search, Filter, Sort -->
        <div class="row g-3 mb-4 align-items-center">
            <!-- Search -->
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-body"><i class="bi bi-search"></i></span>
                    <input type="text" id="search-input" class="form-control" placeholder="Search tools...">
                </div>
            </div>
            
            <!-- Sort Dropdown -->
            <div class="col-md-3">
                <select id="sort-select" class="form-select">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="category">Category</option>
                </select>
            </div>

            <!-- Category Filters -->
            <div class="col-md-4">
                <div id="category-filters" class="d-flex flex-wrap gap-2 justify-content-md-end">
                    <!-- Buttons injected by JS -->
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Fetching tools...</p>
        </div>

        <!-- Error State -->
        <div id="error-message" class="alert alert-danger d-none" role="alert">
            Failed to load data. Please check your connection or file.
        </div>

        <!-- Data Container -->
        <div id="tools-container" class="row g-4"></div>
    </div>

    <!-- ============ BOOTSTRAP JS ============ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ============ APP JS ============ -->
    <script src="app.js"></script>

    <!-- ============ PWA SERVICE WORKER REGISTRATION ============ -->
    <script>
        // Register the Service Worker for offline support & PWA features
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ Service Worker registered!', reg))
                    .catch(err => console.log('❌ Service Worker failed:', err));
            });
        }

        // Handle "Install App" button click
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('d-none'); // Show the button
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to install: ${outcome}`);
            deferredPrompt = null;
            installBtn.classList.add('d-none'); // Hide after install
        });

        // Hide install button if already installed
        window.addEventListener('appinstalled', () => {
            installBtn.classList.add('d-none');
            deferredPrompt = null;
            console.log('✅ PWA was installed');
        });
    </script>
</body>
</html>
